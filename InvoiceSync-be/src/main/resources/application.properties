spring.application.name=invoicesync
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1000000MB
spring.servlet.multipart.max-request-size=1000000MB
spring.datasource.url=jdbc:postgresql://localhost:5432/invoicesync_db
spring.datasource.username=invoicesync_db_user
spring.datasource.password=invoicesync_db_password
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=always
server.error.include-binding-errors=always
spring.jpa.hibernate.ddl-auto=validate
useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.locations=classpath:db/sql/upgrade
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.user=invoicesync_db_user
spring.flyway.password=invoicesync_db_password
spring.flyway.schemas=invoice_sync
spring.flyway.default-schema=invoice_sync

