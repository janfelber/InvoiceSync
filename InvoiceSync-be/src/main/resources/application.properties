# ===============================
# Application
# ===============================
spring.application.name=invoicesync
# ===============================
# File Upload / Multipart
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ===============================
# Database / JPA / Hibernate
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
# ===============================
# Flyway (Database Migration)
# ===============================
spring.flyway.locations=classpath:db/sql/upgrade
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.schemas=invoice_sync
spring.flyway.default-schema=invoice_sync
# ===============================
# Server Error Handling
# ===============================
# Explicit, not relying on Spring Boot's implicit default — never leak internal exception
# messages to the client (bindingErrors are safe/useful: they're validation feedback, not
# internal details).
server.error.include-message=never
server.error.include-binding-errors=always
# ===============================
# Security / JWT
# ===============================
security.jwt.secret-key=${JWT_SECRET}
security.jwt.expiration=900000
security.jwt.refresh-token.expiration=86400000
security.jwt.issuer=invoicesync-api
security.jwt.audience=invoicesync-web
security.jwt.refresh-cookie.name=refreshToken
security.jwt.refresh-cookie.path=/auth
security.jwt.refresh-cookie.secure=true
security.jwt.refresh-cookie.same-site=Strict
# ===============================
# Frontend
# ===============================
app.frontend.url=${FRONTEND_URL}
# ===============================
# Stripe / Billing
# ===============================
stripe.scret.api.key=${STRIPE_SECRET_KEY}
stripe.price.free=${STRIPE_PRICE_FREE}
stripe.price.essentials=${STRIPE_PRICE_ESSENTIALS}
stripe.price.pro=${STRIPE_PRICE_PRO}
stripe.price.enterprise=${STRIPE_PRICE_ENTERPRISE}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
# ===============================
# Google Integration
# ===============================
google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}
# ===============================
# Mail (Gmail SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ===============================
# File Storage (Cloudflare R2)
# ===============================
r2.endpoint=${R2_ENDPOINT}
r2.bucket=${R2_BUCKET}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
# ===============================
# Sentry (Error Tracking / Logging / Tracing)
# ===============================
sentry.dsn=${SENTRY_DSN}
sentry.logs.enabled=true
sentry.traces-sample-rate=1.0
# ===============================
# Logging
# ===============================
logging.level.root=WARN
logging.level.com.invoicesync=INFO
