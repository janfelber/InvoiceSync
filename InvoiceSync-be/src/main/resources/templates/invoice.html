<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    * {
      margin:     0;
      padding:    0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      font-size:   13px;
      color:       #2d2d2d;
    }

    .page {
      width:   100%;
      padding: 0;
    }

    /* ── Blue header ── */
    .header {
      background: #0067DD;
      padding:    28px 48px;
    }

    .header-logo {
      width: 130px;
    }

    .header-right {
      text-align:     right;
      vertical-align: middle;
    }

    .header-invoice-label {
      color:       rgba(255, 255, 255, 0.7);
      font-size:   11px;
      white-space: nowrap;
    }

    .header-invoice-number {
      color:       #ffffff;
      font-size:   22px;
      font-weight: bold;
      white-space: nowrap;
    }

    .header-date-label {
      color:       rgba(255, 255, 255, 0.7);
      font-size:   11px;
      white-space: nowrap;
      margin-top:  8px;
    }

    .header-date-value {
      color:       #ffffff;
      font-size:   13px;
      font-weight: bold;
      white-space: nowrap;
    }

    /* ── Parties section ── */
    .parties {
      padding:    32px 48px;
      border-bottom: 1px solid #e8edf2;
    }

    .party-label {
      font-size:      10px;
      font-weight:    bold;
      color:          #0067DD;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom:  6px;
    }

    .party-name {
      font-size:   14px;
      font-weight: bold;
      color:       #1a1a1a;
      margin-bottom: 4px;
    }

    .party-detail {
      color:       #6b7280;
      font-size:   12px;
      line-height: 1.6;
    }

    /* ── Items table ── */
    .items-section {
      padding: 32px 48px;
    }

    .items-table {
      width:           100%;
      border-collapse: collapse;
    }

    .items-table thead td {
      background:    #f4f7fb;
      color:         #0067DD;
      font-weight:   bold;
      font-size:     11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding:       10px 12px;
      border-bottom: 2px solid #0067DD;
    }

    .items-table tbody td {
      padding:       12px 12px;
      border-bottom: 1px solid #f0f0f0;
      color:         #2d2d2d;
      font-size:     13px;
    }

    .items-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── Totals ── */
    .totals-table {
      border-collapse: collapse;
      min-width:       240px;
    }

    .totals-table td {
      padding: 8px 12px;
    }

    .totals-label {
      color:       #6b7280;
      white-space: nowrap;
      font-size:   12px;
    }

    .totals-value {
      text-align:  right;
      font-weight: bold;
      color:       #1a1a1a;
      white-space: nowrap;
      font-size:   12px;
    }

    .totals-divider {
      border-top: 1px solid #e8edf2;
    }

    .total-final-label {
      background:  #0067DD;
      color:       white;
      font-weight: bold;
      padding:     12px;
      white-space: nowrap;
      font-size:   13px;
    }

    .total-final-value {
      background:  #0067DD;
      color:       white;
      font-weight: bold;
      padding:     12px;
      text-align:  right;
      white-space: nowrap;
      font-size:   13px;
    }

    /* ── Payment details ── */
    .payment-section {
      background: #f4f7fb;
      padding:    24px 48px;
      margin-top: 32px;
    }

    .payment-title {
      font-size:      10px;
      font-weight:    bold;
      color:          #0067DD;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom:  12px;
    }

    .payment-row-label {
      color:       #6b7280;
      font-size:   12px;
      width:       160px;
    }

    .payment-row-value {
      color:       #1a1a1a;
      font-size:   12px;
      font-weight: bold;
    }

    /* ── Footer ── */
    .footer {
      background: #0067DD;
      padding:    14px 48px;
      margin-top: 0;
    }

    .footer-text {
      color:     rgba(255, 255, 255, 0.75);
      font-size: 10px;
    }
  </style>
</head>

          <p class="header-invoice-label">Faktúra číslo</p>
          <p class="header-invoice-number" th:text="${invoice.invoiceDetails.invoiceNumber}"></p>
          <p class="header-date-label" style="margin-top: 10px;">Dátum vystavenia</p>

  </div>

  <!-- ── SUPPLIER / RECIPIENT ── -->
  <div class="parties">
    <table style="width: 100%; border-collapse: collapse;">
      <tbody>
      <tr>
        <td style="width: 50%; vertical-align: top; padding-right: 32px;">
          <p class="party-label">Dodávateľ</p>
          <p class="party-name" th:text="${invoice.company.name}"></p>
          <p class="party-detail"
             th:text="${invoice.company.street + ' ' + invoice.company.streetNumber + ', ' + invoice.company.zip + ' ' + invoice.company.city}"></p>
          <p class="party-detail" th:if="${invoice.company.registrationNumber != null}"
             th:text="'IČO: ' + ${invoice.company.registrationNumber}"></p>
          <p class="party-detail" th:if="${invoice.company.taxId != null}"
             th:text="'DIČ: ' + ${invoice.company.taxId}"></p>
          <p class="party-detail" th:if="${invoice.company.vatId != null}"
             th:text="'IČ DPH: ' + ${invoice.company.vatId}"></p>
        </td>
        <td style="width: 50%; vertical-align: top; text-align: right; border-left: 2px solid #e8edf2; padding-left: 32px;">
          <p class="party-label">Odoberateľ</p>
          <p class="party-name" th:text="${invoice.partner.name}"></p>
          <p class="party-detail"
             th:text="${invoice.partner.street + ', ' + invoice.partner.zip + ' ' + invoice.partner.city}"></p>
          <p class="party-detail" th:if="${invoice.partner.registrationNumber != null}"
             th:text="'IČO: ' + ${invoice.partner.registrationNumber}"></p>
          <p class="party-detail" th:if="${invoice.partner.taxId != null}"
             th:text="'DIČ: ' + ${invoice.partner.taxId}"></p>
          <p class="party-detail" th:if="${invoice.partner.vatId != null}"
             th:text="'IČ DPH: ' + ${invoice.partner.vatId}"></p>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- ── ITEMS TABLE ── -->
  <div class="items-section">
    <table class="items-table">
      <thead>
      <tr>
        <td>Produkt</td>
        <td style="text-align: right;">Množstvo</td>
        <td style="text-align: center;">MJ</td>
        <td style="text-align: right;">Jedn. cena bez DPH</td>
        <td style="text-align: center;">DPH %</td>
        <td style="text-align: right;">Spolu bez DPH</td>
        <td style="text-align: right;">DPH</td>
        <td style="text-align: right;">Spolu s DPH</td>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${invoice.items}">
        <td th:text="${item.name}"></td>
        <td style="text-align: right;" th:text="${item.quantity}"></td>
        <td style="text-align: center;" th:text="${item.unitType}"></td>
        <td style="text-align: right;"
            th:text="${#numbers.formatDecimal(item.unitPriceWithoutVat, 1, 2) + ' €'}"></td>
        <td style="text-align: center;" th:text="${item.vatRate + '%'}"></td>
        <td style="text-align: right;"
            th:text="${#numbers.formatDecimal(item.totalItemPriceWithoutVat, 1, 2) + ' €'}"></td>
        <td style="text-align: right;"
            th:text="${#numbers.formatDecimal(item.totalItemPriceWithVat.subtract(item.totalItemPriceWithoutVat), 1, 2) + ' €'}"></td>
        <td style="text-align: right;"
            th:text="${#numbers.formatDecimal(item.totalItemPriceWithVat, 1, 2) + ' €'}"></td>
      </tr>

      <!-- Totals row -->
      <tr>
        <td colspan="8" style="padding-top: 24px; padding-bottom: 0;">
          <table style="width: 100%; border-collapse: collapse;">
            <tbody>
            <tr>
              <td style="width: 100%;"></td>
              <td>
                <table class="totals-table">
                  <tbody>
                  <tr>
                    <td class="totals-label">Medzisúčet:</td>
                    <td class="totals-value"
                        th:text="${#numbers.formatDecimal(subtotal, 1, 2) + ' €'}"></td>
                  </tr>
                  <tr>
                    <td class="totals-label totals-divider">Daň:</td>
                    <td class="totals-value totals-divider"
                        th:text="${#numbers.formatDecimal(tax, 1, 2) + ' €'}"></td>
                  </tr>
                  <tr>
                    <td class="total-final-label">Celková suma:</td>
                    <td class="total-final-value"
                        th:text="${#numbers.formatDecimal(total, 1, 2) + ' €'}"></td>
                  </tr>
                  </tbody>
                </table>
              </td>
            </tr>
            </tbody>
          </table>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- ── PAYMENT DETAILS ── -->
  <div class="payment-section">
    <p class="payment-title">Platobné informácie</p>
    <table style="border-collapse: collapse;">
      <tbody>
      <tr>
        <td class="payment-row-label">Dátum dodania:</td>
        <td class="payment-row-value" th:text="${invoice.invoiceDetails.taxDate}"></td>
      </tr>
      <tr>
        <td class="payment-row-label" style="padding-top: 6px;">Dátum splatnosti:</td>
        <td class="payment-row-value" style="padding-top: 6px;"
            th:text="${invoice.invoiceDetails.dueDate}"></td>
      </tr>
      <tr>
        <td class="payment-row-label" style="padding-top: 6px;">Variabilný symbol:</td>
        <td class="payment-row-value" style="padding-top: 6px;"
            th:text="${invoice.invoiceDetails.variableSymbol}"></td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- ── FOOTER ── -->
  <div class="footer">
    <table style="width: 100%; border-collapse: collapse;">
      <tbody>
      <tr>
        <td class="footer-text" th:text="${invoice.company.name}"></td>
        <td class="footer-text" style="text-align: right;">Vygenerované cez InvoiceSync</td>
      </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
