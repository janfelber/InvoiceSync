<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <style>
    * {
      margin:     0;
      padding:    0;
      box-sizing: border-box;
    }

    body {
      font-family: "Liberation Sans", Arial, sans-serif;
      font-size:   13px;
      color:       #111111;
      background:  #ffffff;
    }

    .page {
      padding: 56px 64px;
    }

    /* ── Header ── */
    .header-logo {
      width:         120px;
      margin-bottom: 48px;
    }

    .invoice-label {
      font-size:      11px;
      color:          #888888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom:  6px;
    }

    .invoice-number {
      font-size:   28px;
      font-weight: bold;
      color:       #111111;
    }

    .header-meta-label {
      font-size:     11px;
      color:         #888888;
      margin-top:    16px;
      margin-bottom: 3px;
    }

    .header-meta-value {
      font-size:   13px;
      color:       #111111;
      font-weight: bold;
    }

    /* ── Divider ── */
    .divider {
      border:     none;
      border-top: 1px solid #e8e8e8;
      margin:     36px 0;
    }

    /* ── Parties ── */
    .party-label {
      font-size:      10px;
      color:          #888888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom:  10px;
    }

    .party-name {
      font-size:     14px;
      font-weight:   bold;
      color:         #111111;
      margin-bottom: 6px;
    }

    .party-detail {
      font-size:   12px;
      color:       #555555;
      line-height: 1.9;
    }

    /* ── Items ── */
    .items-table {
      width:           100%;
      border-collapse: collapse;
      margin-top:      36px;
    }

    .items-table thead td {
      font-size:      10px;
      color:          #888888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding-bottom: 10px;
      border-bottom:  1px solid #e8e8e8;
    }

    .items-table tbody td {
      padding:       14px 0;
      border-bottom: 1px solid #f2f2f2;
      font-size:     13px;
      color:         #111111;
    }

    .items-table tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── Totals ── */
    .totals-table {
      width:           260px;
      border-collapse: collapse;
      margin-top:      24px;
    }

    .totals-table td {
      padding: 6px 0;
    }

    .t-label {
      font-size: 12px;
      color:     #888888;
    }

    .t-value {
      font-size:  12px;
      color:      #111111;
      text-align: right;
    }

    .t-divider td {
      border-top:  1px solid #e8e8e8;
      padding-top: 14px;
      margin-top:  8px;
    }

    .t-total-label {
      font-size:   15px;
      font-weight: bold;
      color:       #111111;
    }

    .t-total-value {
      font-size:   15px;
      font-weight: bold;
      color:       #0067dd;
      text-align:  right;
    }

    /* ── Footer ── */
    .footer {
      margin-top:  56px;
      border-top:  1px solid #e8e8e8;
      padding-top: 20px;
    }

    .footer-text {
      font-size: 11px;
      color:     #aaaaaa;
    }
  </style>
</head>
<body>
<div class="page">

      </td>
      <td style="text-align: right; vertical-align: bottom;">
        <p class="header-meta-label">Dátum vystavenia</p>
        <p class="header-meta-value" th:text="${invoice.invoiceDetails.issueDate}"></p>
        <p class="header-meta-label">Dátum splatnosti</p>
        <p class="header-meta-value" th:text="${invoice.invoiceDetails.dueDate}"></p>

    </tr>
    </tbody>
  </table>

  <hr class="divider"/>

  <!-- PARTIES -->
  <table style="width: 100%; border-collapse: collapse;">
    <tbody>
    <tr>
      <td style="width: 50%; vertical-align: top; padding-right: 32px;">
        <p class="party-label">Od</p>
        <p class="party-name" th:text="${invoice.supplier.name()}"></p>
        <p class="party-detail" th:text="${invoice.supplier.street + ' ' + invoice.supplier.streetNumber}"></p>
        <p class="party-detail" th:text="${invoice.supplier.postalCode + ' ' + invoice.supplier.city}"></p>
        <p class="party-detail" th:if="${invoice.supplier.registrationNumber != null}"
           th:text="'IČO: ' + ${invoice.supplier.registrationNumber}"></p>
        <p class="party-detail" th:if="${invoice.supplier.taxId != null}"
           th:text="'DIČ: ' + ${invoice.supplier.taxId}"></p>
        <p class="party-detail" th:if="${invoice.supplier.vatId != null}"
           th:text="'IČ DPH: ' + ${invoice.supplier.vatId}"></p>
      </td>
      <td style="width: 50%; vertical-align: top; padding-left: 32px;">
        <p class="party-label">Pre</p>
        <p class="party-name" th:text="${invoice.targetCompany.name}"></p>
        <p class="party-detail" th:text="${invoice.targetCompany.street}"></p>
        <p class="party-detail" th:text="${invoice.targetCompany.postalCode + ' ' + invoice.targetCompany.city}"></p>
        <p class="party-detail" th:if="${invoice.targetCompany.registrationNumber != null}"
           th:text="'IČO: ' + ${invoice.targetCompany.registrationNumber}"></p>
        <p class="party-detail" th:if="${invoice.targetCompany.taxId != null}"
           th:text="'DIČ: ' + ${invoice.targetCompany.taxId}"></p>
        <p class="party-detail" th:if="${invoice.targetCompany.vatId != null}"
           th:text="'IČ DPH: ' + ${invoice.targetCompany.vatId}"></p>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- ITEMS -->
  <table class="items-table">
    <thead>
    <tr>
      <td>Popis</td>
      <td style="text-align: right;">Množ.</td>
      <td style="text-align: center;">MJ</td>
      <td style="text-align: right;">Cena / ks</td>
      <td style="text-align: center;">DPH</td>
      <td style="text-align: right;">Bez DPH</td>
      <td style="text-align: right;">DPH €</td>
      <td style="text-align: right;">Celkom</td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${invoice.items}">
      <td th:text="${item.name}"></td>
      <td style="text-align: right;" th:text="${item.quantity}"></td>
      <td style="text-align: center;" th:text="${item.unit}"></td>
      <td style="text-align: right;"
          th:text="${#numbers.formatDecimal(item.unitPrice.priceWithoutVAT, 1, 2) + ' €'}"></td>
      <td style="text-align: center;" th:text="${item.vatRate + ' %'}"></td>
      <td style="text-align: right;"
          th:text="${#numbers.formatDecimal(item.totalPrice.priceWithoutVAT(), 1, 2) + ' €'}"></td>
      <td style="text-align: right;"
          th:text="${item.totalPrice.priceWithVAT() != null ? #numbers.formatDecimal(item.totalPrice.priceWithVAT().subtract(item.totalPrice.priceWithoutVAT), 1, 2) + ' €' : '0.00 €'}"></td>
      <td style="text-align: right;"
          th:text="${#numbers.formatDecimal(item.totalPrice.priceWithVAT, 1, 2) + ' €'}"></td>
    </tr>
    </tbody>
  </table>

  <!-- TOTALS -->
  <table style="width: 100%; border-collapse: collapse;">
    <tbody>
    <tr>
      <td style="width: 55%;"></td>
      <td style="width: 45%;">
        <table class="totals-table">
          <tbody>
          <tr>
            <td class="t-label">Medzisúčet</td>
            <td class="t-value" th:text="${#numbers.formatDecimal(subtotal, 1, 2) + ' €'}"></td>
          </tr>
          <tr>
            <td class="t-label">Daň</td>
            <td class="t-value" th:text="${#numbers.formatDecimal(tax, 1, 2) + ' €'}"></td>
          </tr>
          <tr>
            <td class="t-label" style="padding-bottom: 10px;">Variabilný symbol</td>
            <td class="t-value" style="padding-bottom: 10px;" th:text="${invoice.invoiceDetails.variableSymbol}"></td>
          </tr>
          <tr class="t-divider">
            <td class="t-total-label">Celková suma</td>
            <td class="t-total-value" th:text="${#numbers.formatDecimal(total, 1, 2) + ' €'}"></td>
          </tr>
          </tbody>
        </table>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- FOOTER -->
  <div class="footer">
    <table style="width: 100%; border-collapse: collapse;">
      <tbody>
      <tr>
        <td class="footer-text" th:text="${invoice.supplier.name}"></td>
        <td class="footer-text" style="text-align: right;">Vygenerované cez InvoiceSync</td>
      </tr>
      </tbody>
    </table>
  </div>

</div>
</body>
</html>
