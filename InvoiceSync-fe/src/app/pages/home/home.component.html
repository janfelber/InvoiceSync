<div class="w-full min-h-screen">
  <div class="mx-auto p-4 pt-20">
    <div class="flex items-center justify-between mb-10">
      <h1 class="text-3xl font-semibold text-gray-700">Domov</h1>
      <button class="px-8 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition" (click)="openModal()">
        Pridať spoločnosť
      </button>
    </div>


    <app-modal
      [show]="modalOpen"
      (closeModal)="closeModal()"
      title="Nová spoločnosť"
    >
      <div class="flex border-b border-blue-300 mb-4">
        <button
          class="w-1/2 py-2 text-center font-semibold"
          [ngClass]="{ 'text-blue-600 border-b-2 border-blue-600': activeTab === 'by_registration', 'text-gray-600': activeTab !== 'by_registration' }"
          (click)="activeTab = 'by_registration'"
        >
          Podľa Iča
        </button>
        <button
          class="w-1/2 py-2 text-center font-semibold"
          [ngClass]="{ 'text-blue-600 border-b-2 border-blue-600': activeTab === 'manual', 'text-gray-600': activeTab !== 'manual' }"
          (click)="activeTab = 'manual'"
        >
          Manuálne
        </button>
      </div>

      <form *ngIf="activeTab === 'by_registration'" (ngSubmit)="saveCompany()">
        <div class="col-span-2">
          <label for="registrationNumber" class="block text-sm font-medium text-gray-900">Názov firmy</label>
          <input
            id="registrationNumber"
            name="registrationNumber"
            required
            [(ngModel)]="registrationNumber"
            class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
          />
        </div>
      </form>

      <form *ngIf="activeTab === 'manual'" [formGroup]="companyForm" (ngSubmit)="saveCompany()">
        <div class="grid gap-4 mb-6 grid-cols-2">
          <div class="col-span-2">
            <label for="companyName" class="block text-sm font-medium text-gray-900">Názov firmy</label>
            <input
              id="companyName"
              formControlName="name"
              required
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="Zadaj názov firmy"
            />
          </div>

          <div>
            <label for="city" class="block text-sm font-medium text-gray-900">Mesto</label>
            <input
              id="city"
              formControlName="city"
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="Zadaj mesto"
            />
          </div>

          <div>
            <label for="zip" class="block text-sm font-medium text-gray-900">PSČ</label>
            <input
              id="zip"
              formControlName="zip"
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="Zadaj PSČ"
            />
          </div>

          <div>
            <label for="street" class="block text-sm font-medium text-gray-900">Ulica</label>
            <input
              id="street"
              formControlName="street"
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="Zadaj ulicu"
            />
          </div>

          <div class="col-span-1">
            <label for="streetNumber" class="block text-sm font-medium text-gray-900">Číslo</label>
            <input
              id="streetNumber"
              formControlName="streetNumber"
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="123"
            />
          </div>

          <div>
            <label for="vatId" class="block text-sm font-medium text-gray-900">IČ DPH</label>
            <input
              id="vatId"
              formControlName="vatId"
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="Zadaj IČ DPH"
            />
          </div>

          <div>
            <label for="taxId" class="block text-sm font-medium text-gray-900">DIČ</label>
            <input
              id="taxId"
              formControlName="taxId"
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="Zadaj DIČ"
            />
          </div>

          <div class="col-span-2">
            <label for="registrationNumber" class="block text-sm font-medium text-gray-900">IČO</label>
            <input
              id="registrationNumber"
              formControlName="registrationNumber"
              required
              class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
              placeholder="Zadaj IČO"
            />
          </div>
        </div>
      </form>

      <hr class="h-px my-4 bg-gray-200 border-0">
      <button
        (click)="saveCompany()"
        type="submit"
        class="text-white items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
        Uložiť
      </button>
    </app-modal>

    <div class="bg-white rounded-2xl overflow-hidden border border-gray-200">
      <div class="flex items-center justify-between p-4">
        <div class="flex flex-col gap-1 w-full">
          <label class="text-sm text-gray-600 font-bold">Čo hľadáte?</label>

          <div class="flex items-center gap-3 w-full">
            <!-- Vyhľadávacie pole -->
            <form class="flex items-center w-full flex">
              <label for="simple-search" class="sr-only">Search</label>
              <div class="relative w-full">
                <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                       viewBox="0 0 20 20">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
                  </svg>
                </div>
                <input type="text" [(ngModel)]="searchText" id="simple-search" name="search"
                       class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full ps-10 p-2.5"
                       placeholder="Vyhľadávanie" required/>
              </div>
            </form>
            <button type="button" disabled
                    class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 w-24 focus:outline-none">
              Filter
            </button>
            <button
              type="button"
              disabled
              class="text-blue-600 border border-blue-600 hover:bg-blue-50 focus:ring-4 focus:ring-blue-100 font-medium rounded-lg text-sm px-5 py-2.5 w-24 focus:outline-none">
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl overflow-hidden mt-10 border border-gray-200">

      <div class="flex items-center justify-between p-4">
        <h2 class="text-lg font-semibold text-gray-700">Spoločnosti</h2>
      </div>

      <table class="w-full text-sm text-left rtl:text-right text-black">
        <thead class="text-xs text-black uppercase bg-gray-100">
        <tr>
          <th scope="col" class="p-4">
            <div class="flex items-center">
              <input id="checkbox-all-search" type="checkbox"
                     class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-blue-500">
              <label for="checkbox-all-search" class="sr-only">checkbox</label>
            </div>
          </th>
          <th scope="col" class="px-6 py-3" *ngFor="let header of headers">{{ header }}</th>
        </tr>
        </thead>
        <tbody>
        <tr class="bg-white border-b border-gray-200 hover:bg-gray-200 last:border-b-0"
            *ngFor="let company of companyResponse.content">
          <td class="w-4 p-4">
            <div class="flex items-center">
              <input id="checkbox-table-search-1" type="checkbox"
                     class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-blue-500">
              <label for="checkbox-table-search-1" class="sr-only">checkbox</label>
            </div>
          </td>
          <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">
            <a [routerLink]="['/web/company', company.id]" [queryParams]="{ name: company.name }"
               class="text-blue-600 hover:underline font-medium">
              {{ company.name }}
            </a>
          </th>
          <td class="px-6 py-4">
            {{ company.city }}
          </td>
          <td class="px-6 py-4">
            {{ company.taxId }}
          </td>
          <td class="px-6 py-4">
            {{ company.vatId }}
          </td>
          <!--                  <td class="px-6 py-4">-->
          <!--                    <a href="#" class="font-medium text-blue-600 dark:text-blue-500 hover:underline">Edit</a>-->
          <!--                  </td>-->
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
