<main>
  <div class="pt-13 mt-6">
    <div class="header border-b-1 border-b-gray-200">
      <nav class="flex mb-4 mx-4" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
          <li class="inline-flex items-center">
            <a routerLink="/home"
               class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600">
              <svg class="w-3 h-3 me-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                   viewBox="0 0 20 20">
                <path
                  d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
              </svg>
              Domov
            </a>
          </li>
          <li aria-current="page">
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="m1 9 4-4-4-4"/>
              </svg>
              <span class="ms-1 text-sm font-medium text-gray-500 md:ms-2">Synxie</span>
            </div>
          </li>
        </ol>
      </nav>

      <div class="flex items-center justify-between mb-4 mx-4">

        <div class="flex space-x-2 mt-2">
          <button
            class="flex items-center space-x-2 px-3 py-1.5 text-sm bg-blue-700 hover:bg-blue-800 rounded-lg">
            <svg class="w-4 h-4 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" d="M17.44 3a1 1 0 0 1 .707.293l2.56 2.56a1 1 0 0 1 0 1.414L18.194 9.78 14.22 5.806l2.513-2.513A1 1 0 0 1 17.44 3Zm-4.634 4.22-9.513 9.513a1 1 0 0 0 0 1.414l2.56 2.56a1 1 0 0 0 1.414 0l9.513-9.513-3.974-3.974ZM6 6a1 1 0 0 1 1 1v1h1a1 1 0 0 1 0 2H7v1a1 1 0 1 1-2 0v-1H4a1 1 0 0 1 0-2h1V7a1 1 0 0 1 1-1Zm9 9a1 1 0 0 1 1 1v1h1a1 1 0 1 1 0 2h-1v1a1 1 0 1 1-2 0v-1h-1a1 1 0 1 1 0-2h1v-1a1 1 0 0 1 1-1Z" clip-rule="evenodd"/>
              <path d="M19 13h-2v2h2v-2ZM13 3h-2v2h2V3Zm-2 2H9v2h2V5ZM9 3H7v2h2V3Zm12 8h-2v2h2v-2Zm0 4h-2v2h2v-2Z"/>
            </svg>
            <span

            class="text-white">Nový chat</span>
          </button>
        </div>
      </div>
    </div>


    <div class="flex flex-col h-screen bg-gray-50">
      <!-- Header -->
      <header class="flex items-center justify-between px-6 py-4 bg-blue-600 text-white shadow">
        <h1 class="text-xl font-semibold">AI Chat</h1>
        <button class="px-3 py-1.5 bg-blue-700 hover:bg-blue-800 rounded" (click)="clearChat()">
          Vymazať chat
        </button>
      </header>

      <!-- Messages -->
      <div class="flex-1 overflow-y-auto p-6 space-y-4" #chatContainer>
        <div *ngFor="let msg of messages" class="flex" [ngClass]="{'justify-end': msg.from==='user','justify-start': msg.from==='ai'}">
          <div [ngClass]="{'bg-blue-600 text-white': msg.from==='user','bg-gray-200 text-gray-800': msg.from==='ai'}"
               class="p-3 rounded-lg max-w-lg break-words">
            {{ msg.text }}
          </div>
        </div>
      </div>

      <!-- Input -->
      <footer class="flex p-4 bg-white border-t border-gray-300">
        <input type="text" [(ngModel)]="currentMessage" (keydown.enter)="sendMessage()"
               placeholder="Napíš správu..."
               class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-1 focus:ring-blue-500"/>
        <button (click)="sendMessage()" class="px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-r-lg">Odoslať</button>
      </footer>
    </div>
  </div>
</main>
