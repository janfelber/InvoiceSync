<main>
  <div class="pt-13 mt-6">
    <div class="header border-b-1 border-b-gray-200">
      <nav class="flex mb-4 mx-4" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
          <li class="inline-flex items-center">
            <a routerLink="/home"
               class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600">
              <svg class="w-3 h-3 me-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                   viewBox="0 0 20 20">
                <path
                  d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
              </svg>
              Domov
            </a>
          </li>
          <li aria-current="page">
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="m1 9 4-4-4-4"/>
              </svg>
              <span class="ms-1 text-sm font-medium text-gray-500 md:ms-2">Synxie</span>
            </div>
          </li>
        </ol>
      </nav>

      <div class="flex items-center justify-end mb-4 mx-4">

        <div class="flex space-x-2 mt-2">
          <button
            class="flex items-center space-x-2 px-3 py-1.5 text-sm bg-blue-700 hover:bg-blue-800 rounded-lg">
            <svg class="w-4.5 h-4.5 text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                 height="24" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd"
                    d="M17.44 3a1 1 0 0 1 .707.293l2.56 2.56a1 1 0 0 1 0 1.414L18.194 9.78 14.22 5.806l2.513-2.513A1 1 0 0 1 17.44 3Zm-4.634 4.22-9.513 9.513a1 1 0 0 0 0 1.414l2.56 2.56a1 1 0 0 0 1.414 0l9.513-9.513-3.974-3.974ZM6 6a1 1 0 0 1 1 1v1h1a1 1 0 0 1 0 2H7v1a1 1 0 1 1-2 0v-1H4a1 1 0 0 1 0-2h1V7a1 1 0 0 1 1-1Zm9 9a1 1 0 0 1 1 1v1h1a1 1 0 1 1 0 2h-1v1a1 1 0 1 1-2 0v-1h-1a1 1 0 1 1 0-2h1v-1a1 1 0 0 1 1-1Z"
                    clip-rule="evenodd"/>
              <path d="M19 13h-2v2h2v-2ZM13 3h-2v2h2V3Zm-2 2H9v2h2V5ZM9 3H7v2h2V3Zm12 8h-2v2h2v-2Zm0 4h-2v2h2v-2Z"/>
            </svg>
            <span

              class="text-white">Nový chat</span>
          </button>
          <button
            (click)="openChatsList()"
            data-tooltip-target="coming-soon-integrations"
            data-tooltip-placement="bottom"
            class="flex items-center justify-center w-8 h-8 hover:bg-gray-200 rounded-md">
            <svg class="w-5.5 h-5.5 text-gray-500"
                 xmlns="http://www.w3.org/2000/svg"
                 fill="none" viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round"
                    stroke-linejoin="round" stroke-width="2"
                    d="M11 9h6m-6 3h6m-6 3h6M6.996 9h.01m-.01 3h.01m-.01 3h.01M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/>
            </svg>
          </button>

          <div id="coming-soon-integrations" role="tooltip"
               class="absolute z-10 invisible inline-block px-3 py-2 text-sm font-medium text-white transition-opacity duration-300 bg-gray-900 rounded-lg shadow-xs opacity-0 tooltip dark:bg-gray-700">
            Integrácie čoskoro dostupné
            <div class="tooltip-arrow" data-popper-arrow></div>
          </div>
        </div>
      </div>
    </div>


    <div
      class="flex flex-col h-[calc(100vh-190px)] text-gray-200 overflow-hidden bg-gray-50">
      <div
        class="flex-1 overflow-y-auto px-6 py-10 scrollbar-thin scrollbar-thumb-white/20 scrollbar-track-transparent">


        <ng-container *ngIf="messages.length === 0; else chatContent">
          <div class="flex flex-col items-center justify-center h-full text-center">
            <div class="w-24 h-24">
              <img
                src="assets/a.jpeg"
                alt="Synxie"
                class="w-full h-full rounded-full object-cover" />
            </div>

            <h2 class="text-xl font-semibold text-gray-800 mb-2">
              Vitaj v Synxie
            </h2>

            <p class="text-gray-600 max-w-md">
              Vyber konverzáciu naľavo alebo začni novú.
              Som tu, aby som ti pomohla s faktúrami, účtovníctvom
              a automatizáciou v InvoiceSync.
            </p>
          </div>
        </ng-container>

        <ng-template #chatContent >
          <div class="max-w-3xl mx-auto space-y-8">
            <ng-container *ngFor="let message of messages" [ngSwitch]="message.role">

              <div class="bg-white px-3 py-2">
              <div *ngSwitchCase="'USER'" class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-sm">
                  J
                </div>
                <div class="bg-[#1e293b] rounded-xl px-4 py-3 text-sm">
                  {{ message.content }}
                </div>
              </div>

              <div *ngSwitchCase="'ASSISTANT'" class="flex items-start gap-3">
                <!-- Obrázok AI -->
                <div class="w-8 h-8">
                  <img
                    src="assets/a.jpeg"
                    alt="Synxie"
                    class="w-full h-full rounded-full object-cover" />
                </div>

                <div class="bg-[#111827] rounded-xl px-5 py-4 text-sm leading-relaxed shadow text-gray-300">
                  {{ message.content }}
                </div>
              </div>
              </div>

            </ng-container>
          </div>
        </ng-template>
      </div>
      <div class="border-t border-b border-gray-300 px-6 py-4">
        <div
          class="max-w mx-auto flex items-center rounded-xl">
          <input
            type="text"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full"
          />
          <button class="px-4 text-blue-500 hover:text-blue-400">
            ➤
          </button>
        </div>
      </div>
    </div>

    <!-- Drawer -->
    <div
      id="drawer-right-example"
      [class.translate-x-0]="chatsOpen"
      [class.translate-x-full]="!chatsOpen"
      class="fixed top-16 right-0 z-40 h-[calc(100vh-4rem)] p-4 overflow-hidden bg-white w-80
         transform transition-transform duration-300 ease-in-out translate-x-full
         flex flex-col"
      tabindex="-1"
      aria-labelledby="drawer-right-label"
    >
      <p id="drawer-right-label"
         class="inline-flex items-center mb-4 text-md font-semibold text-gray-500 pb-4 border-b border-gray-300">
        História chatov
      </p>

      <button type="button" (click)="closeChatsList()"
              class="text-gray-400 hover:bg-gray-200 hover:text-gray-800 rounded-md w-8 h-8 absolute top-2.5 end-2.5 flex items-center justify-center transition">
        <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
        </svg>
      </button>

      <div class="flex-1 overflow-y-auto pr-1 scrollbar-thin scrollbar-thumb-gray-300 scrollbar-track-transparent">
        <div class="space-y-3">
          <div *ngFor="let chat of lastChatsList">
            <details class="rounded-lg text-md">
              <summary
                (click)="loadConversationMessages(chat.conversationId)"
                class="cursor-pointer text-black px-3 py-2 flex items-center hover:bg-gray-100 rounded-md transition">
                <svg class="w-5 h-5 text-gray-800 mr-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
                     height="24" fill="none" viewBox="0 0 24 24">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 9h5m3 0h2M7 12h2m3 0h5M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-6.616a1 1 0 0 0-.67.257l-2.88 2.592A.5.5 0 0 1 8 18.477V17a1 1 0 0 0-1-1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/>
                </svg>
                {{ chat.title }}
              </summary>
            </details>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
