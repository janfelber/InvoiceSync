<main class="pt-13 px-4 mt-6 pb-10">

  <!-- Breadcrumb + title -->
  <div class="mb-8">
    <nav class="flex mb-2" aria-label="Breadcrumb">
      <ol class="inline-flex items-center space-x-1">
        <li class="inline-flex items-center">
          <a routerLink="/home" class="inline-flex items-center text-sm text-gray-500 hover:text-blue-600 dark:text-gray-400 dark:hover:text-blue-400">
            <svg class="w-3 h-3 me-2" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
              <path d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
            </svg>
            Domov
          </a>
        </li>
        <li>
          <div class="flex items-center">
            <svg class="w-3 h-3 text-gray-400 mx-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="m1 9 4-4-4-4"/>
            </svg>
            <span class="ms-1 text-sm text-gray-500 dark:text-gray-400">Integrácie</span>
          </div>
        </li>
      </ol>
    </nav>
    <h1 class="text-xl font-semibold text-gray-900 dark:text-white">Integrácie</h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Prepojte InvoiceSync s nástrojmi, ktoré denne používate.</p>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

    <!-- Google -->
    <button (click)="goTo('/web/integrations/google')" type="button"
      class="text-left flex items-center gap-4 px-4 py-4 rounded-xl border border-gray-200 dark:border-[#383852] bg-white dark:bg-[#1a1b1e] hover:border-gray-300 dark:hover:border-[#4a4a6a] hover:shadow-sm transition-all duration-150">
      <div class="w-9 h-9 rounded-lg border border-gray-200 dark:border-[#383852] bg-gray-50 dark:bg-[#2a2b30] flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-900 dark:text-white">Google</p>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">Gmail · Drive</p>
      </div>
      <svg class="w-4 h-4 text-gray-300 dark:text-gray-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <!-- Dropbox — coming soon -->
    <div class="flex items-center gap-4 px-4 py-4 rounded-xl border border-dashed border-gray-200 dark:border-[#2e2e40] bg-transparent cursor-not-allowed opacity-50">
      <div class="w-9 h-9 rounded-lg border border-gray-200 dark:border-[#383852] bg-gray-50 dark:bg-[#2a2b30] flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="#0061FF" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 2L0 6l6 4-6 4 6 4 6-4-6-4 6-4zm12 0l-6 4 6 4-6 4 6 4 6-4-6-4 6-4zM6 17.5L12 14l6 3.5-6 3.5z"/>
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Dropbox</p>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">Čoskoro</p>
      </div>
    </div>

  </div>
</main>
