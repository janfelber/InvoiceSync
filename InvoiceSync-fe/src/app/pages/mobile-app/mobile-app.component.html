<div class="flex flex-col md:flex-row h-screen w-full bg-white">

  <!-- LEFT SIDE – INFO -->
  <div class="md:w-1/2 flex flex-col justify-center items-center px-8 py-12 text-center bg-white">
    <img src="../../../assets/mobile-app.svg"
         alt="Mobile App"
         class="w-64 h-auto mb-8 drop-shadow-md transition-opacity duration-700 ease-in opacity-100" />

    <h1 class="text-4xl md:text-5xl font-extrabold text-gray-800 mb-4 leading-tight transition-transform duration-500 ease-out">
      InvoiceSync Go je na ceste
    </h1>
    <p class="text-gray-600 text-base md:text-lg max-w-md mb-6 leading-relaxed">
      Pracujeme na mobilnej aplikácii, ktorá vám umožní spravovať faktúry a bločky kdekoľvek a kedykoľvek.
    </p>

    <!-- E-mail input + button -->
    <div class="flex flex-col sm:flex-row items-center gap-2 w-full max-w-md mt-2">
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="Zadaj svoj e-mail"
        required
        class="flex-1 px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
      />
      <button
        (click)="onSubscribe()"
        class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition hover:scale-105">
        Daj mi vedieť
      </button>
    </div>
  </div>

  <!-- RIGHT SIDE – COUNTDOWN -->
  <div class="md:w-1/2 flex flex-col justify-center items-center bg-gradient-to-br from-[#eff6ff] to-blue-100 px-8 py-12">
    <h2 class="text-2xl md:text-3xl font-semibold text-blue-900 mb-8 transition-opacity duration-700">
      Spustenie aplikácie o
    </h2>

    <div class="flex gap-6 text-center">
      <div class="bg-white shadow rounded-lg px-4 py-3 w-20 transition-transform duration-300 hover:scale-105">
        <div class="text-3xl font-bold text-gray-800">{{ days }}</div>
        <div class="text-sm text-gray-500">dní</div>
      </div>
      <div class="bg-white shadow rounded-lg px-4 py-3 w-20 transition-transform duration-300 hover:scale-105">
        <div class="text-3xl font-bold text-gray-800">{{ hours }}</div>
        <div class="text-sm text-gray-500">hodín</div>
      </div>
      <div class="bg-white shadow rounded-lg px-4 py-3 w-20 transition-transform duration-300 hover:scale-105">
        <div class="text-3xl font-bold text-gray-800">{{ minutes }}</div>
        <div class="text-sm text-gray-500">minút</div>
      </div>
      <div class="bg-white shadow rounded-lg px-4 py-3 w-20 transition-transform duration-300 hover:scale-105">
        <div class="text-3xl font-bold text-gray-800">{{ seconds }}</div>
        <div class="text-sm text-gray-500">sekúnd</div>
      </div>
    </div>
  </div>
</div>
