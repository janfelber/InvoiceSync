<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6 flex flex-col items-center">

    <!-- App logo / name -->
    <h1 class="text-2xl font-bold text-gray-800 mb-4">InvoiceSync</h1>

    <!-- Instruction -->
    <p class="text-gray-600 text-center mb-6">
      Scan this QR code with your InvoiceSync mobile app to login.
    </p>

    <!-- QR Code container -->
    <div class="w-64 h-64 flex items-center justify-center bg-gray-100 rounded-lg border-2 border-dashed border-gray-300 mb-6">
      <img *ngIf="qrCodeImage" [src]="qrCodeImage" alt="QR Code" class="w-56 h-56" />
      <span *ngIf="!qrCodeImage" class="text-gray-400">QR code loading...</span>
    </div>

    <!-- Footer info -->
    <p class="text-gray-400 text-sm text-center">
      Make sure your mobile app is connected to the internet.
    </p>

  </div>
</div>
