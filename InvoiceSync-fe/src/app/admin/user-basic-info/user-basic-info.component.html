<main class="bg-gray-50 min-h-screen flex flex-col items-start justify-start">
  <div class="bg-white border border-gray-200 rounded-lg w-[600px]">
    <div>
      <div class="p-4">
        <p class="text-sm font-medium text-gray-800">Basic info</p>
      </div>
      <div class="border-b border-gray-200"></div>
    </div>
    <div class="p-4">
      <div class="flex flex-col">
        <div class="flex items-center justify-between py-2">
          <label for="fullName" class="text-sm font-medium text-gray-700">Name</label>
          <input
            [(ngModel)]="user.fullName"
            id="fullName" name="fullName" type="text"
            class="w-80 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <hr class="h-px my-2 bg-gray-200 border-0">

      <div class="flex flex-col">
        <div class="flex items-center justify-between py-2">
          <label for="email" class="text-sm font-medium text-gray-700">E-mail</label>
          <input
            [(ngModel)]="user.email"
            id="email" name="email" type="email"
            class="w-80 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="flex items-center justify-between py-2">
          <label for="username" class="text-sm font-medium text-gray-700">Username</label>
          <input
            [(ngModel)]="user.username"
            id="username" name="username" type="text"
            class="w-80 border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
    </div>

  </div>


  <div class="mt-4">
    <button type="button"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
      Save
    </button>
  </div>
</main>
