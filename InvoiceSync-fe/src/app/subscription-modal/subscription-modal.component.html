<div
  *ngIf="show"
  (click)="onBackdropClick($event)"
  class="modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center z-50"
>
  <div class="relative p-4 w-full max-w-[864px] self-center" (click)="$event.stopPropagation()">
    <div class="relative bg-white rounded-lg shadow-sm">
      <!-- Close button umiestnený absolútne -->
      <button type="button"
              class="absolute top-4 right-4 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center"
              (click)="onClose()">
        <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>


      <div class="px-8 pb-8 pt-8 grid grid-cols-2 gap-12">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
