

<mat-form-field>
  <mat-label>Select a company</mat-label>
  <mat-select disableRipple>
    <mat-option *ngFor="let company of companies" [value]="company.company_id" (click)="onCompanyChange(company)">
      {{ company.name }}
    </mat-option>
  </mat-select>
</mat-form-field>



 
<div class="card">

  <div class="card-body">
    
    <div *ngIf="isLoading">
      <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
    </div>
    <div *ngIf="!isLoading && imports.length === 0">
      <mat-icon class="icon">upload_file</mat-icon>
      <p class="text">Get started by adding your first file</p>
      <p class="text">Drag & Drop</p>
      <p class="text">or</p>
      <button mat-flat-button color="basic" [style.backgroundColor]="'rgba(192, 192, 192, 0.35)'" (click)="openFileDialog()">
        <mat-icon>upload</mat-icon>
        Import
      </button>
    </div> 
    <div *ngIf="imports.length > 0" class="table-wrapper">
      <div class="table-container limited-height">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
          <ng-container matColumnDef="filename">
            <th mat-header-cell *matHeaderCellDef> nazov </th>
            <td mat-cell *matCellDef="let element"> {{element.filename}} </td>
          </ng-container>
    
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef> uzivatel </th>
            <td mat-cell *matCellDef="let element"> {{element.username}} </td>
          </ng-container>
    
          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef> pridane </th>
            <td mat-cell *matCellDef="let element"> {{ element.created_at * 1000 | date: 'dd.MM.yyyy' }} </td>
          </ng-container>
    
          <ng-container matColumnDef="download">
            <th mat-header-cell *matHeaderCellDef> stiahnuť </th>
            <td mat-cell *matCellDef="let element">
              <button mat-icon-button (click)="downloadFile(element.id)">
                <mat-icon>download</mat-icon>
              </button>
            </td>
          </ng-container>
    
          <tr mat-header-row *matHeaderRowDef="displayedColumn"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumn;"></tr>
        </table>
      </div>
    </div>
    
</div>
