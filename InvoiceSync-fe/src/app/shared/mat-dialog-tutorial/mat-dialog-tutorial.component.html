<div
  *ngIf="show" xmlns="http://www.w3.org/1999/html"
  (click)="onBackdropClick($event)"
  class="modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center z-50"
>
  <div class="relative p-4 w-full max-w-[990px] h-[78vh]" (click)="$event.stopPropagation()">
    <div class="relative bg-white rounded-lg shadow-sm flex flex-col h-full overflow-hidden">

      <div class="flex items-center justify-between p-2 border-b border-gray-200">
        <button
          *ngIf="selectedApp"
          (click)="goBackToAppSelection()"
          type="button"
          class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 flex items-center justify-center"
          aria-label="Späť na výber aplikácie"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>

        <div class="flex-1"></div>

        <!-- Close button -->
        <button type="button"
                class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 flex items-center justify-center"
                (click)="onClose()"
                aria-label="Zavrieť modal"
        >
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
          </svg>
          <span class="sr-only">Zavrieť</span>
        </button>
      </div>


      <!-- Select app -->
      <div *ngIf="!selectedApp" class="p-6 w-full h-full overflow-auto">
        <!-- Headline -->
        <div class="mb-6">
          <h2 class="text-2xl font-bold text-gray-800">{{ tutorialSelectionName }}</h2>
          <p class="text-sm text-gray-500 mt-1">Vyberte, s ktorou aplikáciou pracujete:</p>
        </div>

        <!-- App choose -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
          <div
            *ngFor="let app of availableApps"
            (click)="selectApp(app)"
            class="cursor-pointer bg-white border border-gray-200 hover:border-blue-500 hover:shadow-md rounded-xl transition-all overflow-hidden group"
          >
            <!-- Thumbnail -->
            <img
              *ngIf="tutorialsByApp[app]?.[0]?.thumbnail"
              [src]="tutorialsByApp[app][0].thumbnail"
              alt="Náhľad pre {{ app }}"
              class="w-full h-28 object-cover transition-transform duration-200 group-hover:scale-[1.02]"
            />

            <!-- Text -->
            <div class="p-4">
              <h3 class="text-base font-semibold text-gray-800 mb-1">{{ app }}</h3>
              <p class="text-sm text-gray-500">
                {{ tutorialsByApp[app][0]?.thumbnailText || 'Ukážka tutoriálu' }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Tutorial content -->
      <div *ngIf="selectedApp" class="flex-1 flex flex-col overflow-hidden">
        <!-- Video slider -->
        <div class="relative w-full h-[500px] overflow-hidden bg-gray-100">
          <div
            class="flex transition-transform duration-500 ease-in-out"
            [style.transform]="'translateX(-' + currentTutorialIndex * 100 + '%)'"
          >
            <div
              *ngFor="let tutorial of tutorials"
              class="w-full flex-shrink-0 h-[500px] flex items-center justify-center"
            >
              <video
                #videoPlayer
                [src]="tutorial.src"
                muted
                playsinline
                preload="auto"
                loop
                class="h-full w-full object-contain"
              >
              </video>
            </div>
          </div>
        </div>

        <!-- Text + arrows -->
        <div class="bg-white p-4 flex items-center justify-between border-t border-gray-200 min-h-[150px]">
          <!-- Ľavá šípka -->
          <button (click)="prevTutorial()" [disabled]="currentTutorialIndex === 0">
            <div class="bg-gray-100 rounded-xl p-2 w-10 h-20 hover:bg-gray-200 flex items-center justify-center">
              <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
              </svg>
            </div>
          </button>

          <!-- Text slider -->
          <div class="flex-1 overflow-hidden">
            <div
              class="flex transition-transform duration-500 ease-in-out"
              [style.transform]="'translateX(-' + currentTutorialIndex * 100 + '%)'"
            >
              <div
                *ngFor="let tutorial of tutorials"
                class="w-full flex-shrink-0 text-center px-4"
              >
                <p class="text-gray-700">{{ tutorial.text }}</p>
              </div>
            </div>
          </div>

          <!-- Pravá šípka -->
          <button (click)="nextTutorial()" [disabled]="currentTutorialIndex >= tutorials.length - 1">
            <div class="bg-gray-100 rounded-xl p-2 w-10 h-20 hover:bg-gray-200 flex items-center justify-center">
              <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </div>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
