@if (show) {
  <div
    (click)="onBackdropClick($event)"
    class="modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center z-50 animate-fade-in">

    <div class="relative w-full max-w-md px-4 animate-slide-up" (click)="$event.stopPropagation()">
      <div class="relative bg-white dark:bg-[#1a1b1e] rounded-xl border border-gray-200 dark:border-[#383852] shadow-xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 dark:border-[#383852]">
          <h3 class="text-sm font-semibold text-gray-900 dark:text-white">{{ title }}</h3>
          <button
            type="button"
            (click)="onClose()"
            class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#383852] transition-colors">
            <svg class="w-3.5 h-3.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
            <span class="sr-only">Close</span>
          </button>
        </div>

        <!-- Body -->
        <div class="px-5 py-5">
          <ng-content></ng-content>
        </div>

      </div>
    </div>
  </div>
}
