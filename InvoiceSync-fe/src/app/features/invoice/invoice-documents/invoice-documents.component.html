<div class="w-full min-h-screen flex flex-col p-4">
  <div class="bg-white dark:bg-[#1a1b1e] rounded-lg overflow-hidden border border-gray-200 dark:border-[#383852]">
    <div class="flex flex-col space-y-0">
      <div class="flex items-center justify-between py-2.5 px-8 border-b border-gray-300 dark:border-[#383852]">
        <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-300">Dokumenty</h2>
      </div>
      <div class="flex items-center justify-between py-2 px-8">
        <button
          (click)="openAddDocumentModal()"
          class="flex items-center px-3 py-2 text-sm text-gray-900 dark:text-slate-200 bg-white dark:bg-transparent border border-gray-300 dark:border-[#383852] rounded-md hover:bg-gray-50 dark:hover:bg-[#2a2b30] transition-colors h-[32px]">
          <svg class="w-4 h-4 mr-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 7.757v8.486M7.757 12h8.486M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
          </svg>
          Pridať dokument
        </button>
      </div>
    </div>


    <app-modal
      [show]="addDocumentModalOpen"
      (closeModal)="closeAddDocumentModal()"
      title="Pridať dokument"
    >
      <form>
        <div class="space-y-4 mb-6">

          <div>
            <label for="name" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Názov</label>
            <input
              id="name"
              [(ngModel)]="documentName"
              name="name"
              required
              placeholder="Názov dokumentu"
              class="w-full border border-slate-200 dark:border-[#383852] rounded-md px-3 py-2 text-sm bg-slate-50 dark:bg-[#2a2b30] text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors placeholder-slate-400 dark:placeholder-slate-600"
            />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Dokument</label>
            <label for="importFile"
              class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed rounded-lg cursor-pointer transition-colors"
              [class]="selectedFile
                ? 'border-blue-400 bg-blue-50 dark:bg-blue-900/10 dark:border-blue-500'
                : 'border-slate-300 dark:border-[#383852] bg-slate-50 dark:bg-[#2a2b30] hover:bg-slate-100 dark:hover:bg-[#333448]'">
              <div class="flex flex-col items-center justify-center gap-1" *ngIf="!selectedFile">
                <svg class="w-7 h-7 text-slate-400 dark:text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
                </svg>
                <p class="text-sm text-slate-500 dark:text-slate-400"><span class="font-medium text-blue-600 dark:text-blue-400">Kliknite</span> alebo presuňte súbor</p>
                <p class="text-xs text-slate-400 dark:text-slate-500">PDF, PNG, JPG, XLSX...</p>
              </div>
              <div class="flex items-center gap-3" *ngIf="selectedFile">
                <svg class="w-8 h-8 text-blue-500 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
                </svg>
                <div>
                  <p class="text-sm font-medium text-slate-800 dark:text-slate-100">{{ selectedFile.name }}</p>
                  <p class="text-xs text-slate-400 dark:text-slate-500">{{ (selectedFile.size / 1024).toFixed(1) }} KB</p>
                </div>
              </div>
            </label>
            <input id="importFile" (change)="onFileSelected($event)" name="importFile" type="file" class="hidden"/>
          </div>

          <div>
            <label for="note" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Poznámka</label>
            <input
              id="note"
              [(ngModel)]="note"
              name="note"
              placeholder="Voliteľná poznámka..."
              class="w-full border border-slate-200 dark:border-[#383852] rounded-md px-3 py-2 text-sm bg-slate-50 dark:bg-[#2a2b30] text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors placeholder-slate-400 dark:placeholder-slate-600"
            />
          </div>

        </div>
        <div class="flex justify-end gap-2 pt-4 border-t border-slate-100 dark:border-[#383852]">
          <button
            type="button"
            (click)="closeAddDocumentModal()"
            class="px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-transparent border border-slate-300 dark:border-[#383852] rounded-lg hover:bg-slate-50 dark:hover:bg-[#2a2b30] transition-colors">
            Zrušiť
          </button>
          <button
            (click)="uploadDocument()"
            [disabled]="isUploading"
            type="submit"
            class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed rounded-lg transition-colors">
            <ng-container *ngIf="!isUploading; else loading">
              <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
              </svg>
              Importovať
            </ng-container>
            <ng-template #loading>
              <svg class="animate-spin h-4 w-4 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
              </svg>
              Nahrávam...
            </ng-template>
          </button>
        </div>
      </form>
    </app-modal>


    <table class="w-full text-sm text-left text-gray-500 border-t border-gray-300 dark:border-[#383852]">
      <thead class="text-xs text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-[#2a2b30] border-b border-gray-200 dark:border-[#383852]">
      <tr>
        <th scope="col" class="px-4 py-3 border-r border-gray-300 dark:border-[#383852] last:border-r-0">Názov</th>
        <th scope="col" class="px-4 py-3 border-r border-gray-300 dark:border-[#383852] last:border-r-0">Dokument</th>
        <th scope="col" class="px-4 py-3 border-r border-gray-300 dark:border-[#383852] last:border-r-0">Importovaný</th>
        <th scope="col" class="px-4 py-3 border-r border-gray-300 dark:border-[#383852] last:border-r-0">Poznámka</th>
        <th scope="col" class="px-4 py-3 w-[60px] text-center">Akcie</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 dark:divide-[#383852]">
      <tr class="last:border-b-0" *ngFor="let document of documents; let even = even"
          [ngClass]="even ? 'bg-white dark:bg-[#1a1b1e]' : 'bg-white dark:bg-[#2a2b30]'"
      >
        <td class="px-4 py-3 text-black dark:text-white border-r border-gray-300 dark:border-[#383852] last:border-r-0">{{ document.documentName }}</td>
        <td class="px-4 py-3 border-r border-gray-300 dark:border-[#383852] last:border-r-0 text-blue-600 hover:underline">
          <a href="#">{{ document.fileName }}</a>
        </td>
        <td class="px-4 py-3 text-black dark:text-white border-r border-gray-300 dark:border-[#383852] last:border-r-0">{{ document.createdAt | date:'dd.MM.yyyy' }}</td>
        <td class="px-4 py-3 text-black dark:text-white border-r border-gray-300 dark:border-[#383852] last:border-r-0">{{ document.note }}</td>
        <!-- Actions -->
        <td class="px-4 py-3 text-right border-r border-gray-300 dark:border-[#383852] last:border-r-0">
          <button
            (click)="deleteDocumentFromInvoice(document.id)"
            class="text-gray-400">
            <svg
              class="text-slate-400 hover:text-red-600 p-1 rounded transition-colors"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
            </svg>
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
