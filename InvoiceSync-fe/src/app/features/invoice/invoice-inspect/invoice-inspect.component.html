<main>
  <div class="pt-13 mt-6">

    <!-- ── Page Header ── -->
    <div class="header border-b-1 border-b-gray-200 dark:border-[#383852]">
      <nav class="flex mb-4 mx-4" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
          <li class="inline-flex items-center">
            <a routerLink="/home"
               class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600 dark:text-white">
              <svg class="w-3 h-3 me-2.5 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                   fill="currentColor" viewBox="0 0 20 20">
                <path d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
              </svg>
              {{ 'NAV.HOME' | translate }}
            </a>
          </li>
          <li>
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 dark:text-white mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="m1 9 4-4-4-4"/>
              </svg>
              <a routerLink="/invoices"
                 class="ms-1 text-sm font-medium text-gray-700 dark:text-white hover:text-blue-600 md:ms-2">{{ 'INVOICE.TITLE' | translate }}</a>
            </div>
          </li>
          <li aria-current="page">
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 dark:text-white mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="m1 9 4-4-4-4"/>
              </svg>
              <span class="ms-1 text-sm font-medium text-gray-500 dark:text-white md:ms-2">{{ 'INVOICE.NUMBER' | translate }}</span>
            </div>
          </li>
        </ol>
      </nav>

      <div class="flex items-center mb-3 mx-4">
        <a routerLink="/invoices" class="flex items-center space-x-2 text-black dark:text-white no-underline hover:underline">
          <svg class="w-6 h-6 text-black dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
               width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5 12h14M5 12l4-4m-4 4 4 4"/>
          </svg>
          <h1 class="text-lg font-semibold dark:text-white">{{ 'INVOICE.BACK' | translate }}</h1>
        </a>
      </div>
    </div>

    <!-- ── Tabs ── -->
    <div class="border-b border-slate-200 dark:border-[#383852] bg-white dark:bg-[#1a1b1e] px-4">
      <ul class="flex -mb-px text-sm font-medium" id="invoice-tabbing"
          data-tabs-toggle="#invoice-content" role="tablist">
        <li class="me-1" role="presentation">
          <button
            class="inline-flex items-center gap-2 px-4 py-3 border-b-2 border-transparent rounded-t-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:border-slate-300 dark:hover:border-slate-600 transition-colors"
            id="invoice-tab" data-tabs-target="#invoice" type="button" role="tab" aria-selected="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
              <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
              <path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
            </svg>
            Faktúra
          </button>
        </li>
        <li class="me-1" role="presentation">
          <button
            class="inline-flex items-center gap-2 px-4 py-3 border-b-2 border-transparent rounded-t-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:border-slate-300 dark:hover:border-slate-600 transition-colors"
            id="documents-tab" data-tabs-target="#documents" type="button" role="tab" aria-selected="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
              <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            </svg>
            Dokumenty
          </button>
        </li>
      </ul>
    </div>

    <!-- ── Tab Content ── -->
    <div id="invoice-content" class="bg-slate-50 dark:bg-[#111213] min-h-screen">
      <div class="hidden" id="invoice" role="tabpanel" aria-labelledby="invoice-tab">

        <!-- Invoice identity -->
        <div class="flex items-center justify-between gap-3 px-4 pt-5 pb-2" *ngIf="invoice?.invoiceDetails">
          <div class="flex items-center gap-3">
            <div class="h-10 w-10 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                   class="text-white">
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
                <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
                <path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>
              </svg>
            </div>
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <h1 class="text-xl font-bold text-slate-900 dark:text-white">{{ invoice?.invoiceDetails?.invoiceNumber }}</h1>
                <span *ngIf="statusLabel" class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium ring-1 ring-inset" [ngClass]="statusClasses">
                  {{ statusLabel }}
                </span>
              </div>
              <p class="text-sm text-slate-500 dark:text-slate-400">
                VS: <span class="font-medium text-slate-700 dark:text-slate-300">{{ invoice?.invoiceDetails?.variableSymbol ?? '—' }}</span>
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <button
              id="dropdownDownloadButton"
              data-dropdown-toggle="downloadDropdown"
              class="inline-flex items-center px-4 py-2 border border-slate-300 dark:border-[#383852] rounded-lg text-sm font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-transparent hover:bg-slate-50 dark:hover:bg-white/5 transition-colors"
              type="button">
              <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" x2="12" y1="15" y2="3"/>
              </svg>
              Stiahnuť
              <svg class="w-3 h-3 ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4"/>
              </svg>
            </button>

            <div id="downloadDropdown"
                 class="z-10 hidden bg-white dark:bg-[#1a1b1e] divide-y divide-slate-100 dark:divide-[#383852] rounded-lg shadow-lg w-48 border border-slate-200 dark:border-[#383852]">
              <ul class="py-2 px-2 text-sm text-slate-600 dark:text-slate-400">
                <li>
                  <div class="group px-3 py-2 flex items-center rounded-md hover:bg-slate-50 dark:hover:bg-[#2a2b30] hover:text-slate-900 dark:hover:text-white cursor-pointer transition-colors">
                    <svg class="w-4 h-4 mr-2 text-slate-400 group-hover:text-slate-700 dark:group-hover:text-white" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                      <path fill-rule="evenodd" d="M9 7V2.221a2 2 0 0 0-.5.365L4.586 6.5a2 2 0 0 0-.365.5H9Zm2 0V2h7a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9h5a2 2 0 0 0 2-2Zm2-2a1 1 0 1 0 0 2h3a1 1 0 1 0 0-2h-3Zm0 3a1 1 0 1 0 0 2h3a1 1 0 1 0 0-2h-3Zm-6 4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-6Zm8 1v1h-2v-1h2Zm0 3h-2v1h2v-1Zm-4-3v1H9v-1h2Zm0 3H9v1h2v-1Z" clip-rule="evenodd"/>
                    </svg>
                    Uložiť ako Excel
                  </div>
                </li>
              </ul>
            </div>

            <button
              class="inline-flex items-center px-4 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition-colors">
              <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7.414A2 2 0 0 0 20.414 6L18 3.586A2 2 0 0 0 16.586 3H5Zm3 11a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v6H8v-6Zm1-7V5h6v2a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1Z" clip-rule="evenodd"/>
                <path fill-rule="evenodd" d="M14 17h-4v-2h4v2Z" clip-rule="evenodd"/>
              </svg>
              Uložiť
            </button>
          </div>
        </div>

        <invoice-info></invoice-info>
      </div>
      <div class="hidden" id="documents" role="tabpanel" aria-labelledby="documents-tab">
        <invoice-documents></invoice-documents>
      </div>
    </div>

  </div>
</main>
