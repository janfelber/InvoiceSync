<main>
  <div class="pt-13 mt-6">
    <div class="header border-b-1 border-b-gray-200 dark:border-[#383852]">
      <nav class="flex mb-4 mx-4" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
          <li class="inline-flex items-center">
            <a routerLink="/home"
               class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600 dark:text-white">
              <svg class="w-3 h-3 me-2.5 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                   viewBox="0 0 20 20">
                <path
                  d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
              </svg>
              Domov
            </a>
          </li>
          <li>
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 dark:text-white mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="m1 9 4-4-4-4"/>
              </svg>
              <a routerLink="/web/receipts"
                 class="ms-1 text-sm font-medium text-gray-700 dark:text-white hover:text-blue-600 md:ms-2">Bločky</a>
            </div>
          </li>
          <li aria-current="page">
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 dark:text-white mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="m1 9 4-4-4-4"/>
              </svg>
              <span class="ms-1 text-sm font-medium text-gray-500 dark:text-white md:ms-2">Bloček</span>
            </div>
          </li>
        </ol>
      </nav>

      <div class="flex items-center justify-between mb-4 mx-4">
        <a routerLink="/web/receipts" class="flex items-center space-x-2 text-black dark:text-white no-underline hover:underline">
          <svg class="w-6 h-6 text-black dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5 12h14M5 12l4-4m-4 4 4 4"/>
          </svg>
          <h1 class="text-lg font-semibold dark:text-white">Späť na bločky</h1>
        </a>
      </div>
    </div>

    <div class="pt-4 border-b border-gray-300 dark:border-[#383852] bg-gray-50 dark:bg-[#1a1b1e]">
      <ul class="flex flex-wrap -mb-px text-sm font-medium text-center justify-start" id="invoice-tabbing"
          data-tabs-toggle="#invoice-content" role="tablist">
        <li class="me-2 mx-1" role="presentation">
          <button class="inline-block p-1 px-3 border-b-2 rounded-t-lg !text-black hover:!border-blue-500 dark:!text-white"
                  id="invoice-tab" data-tabs-target="#invoice" type="button" role="tab" aria-controls="profile"
                  aria-selected="false">Bloček
          </button>
        </li>
        <li class="me-2" role="presentation">
          <button
            class="inline-block p-1 px-3 border-b-2 rounded-t-lg !text-black hover:!border-blue-500 dark:!text-white"
            id="documents-tab" data-tabs-target="#documents" type="button" role="tab" aria-controls="dashboard"
            aria-selected="false">Dokumenty
          </button>
        </li>
      </ul>
    </div>

    <div id="invoice-content" class="min-h-screen bg-slate-50 dark:bg-[#1c1d21]">
      <div class="hidden rounded-lg" id="invoice" role="tabpanel"
           aria-labelledby="invoice-tab">
        <app-receipt-details></app-receipt-details>
      </div>
      <div class="hidden rounded-lg"
           id="documents" role="tabpanel"
           aria-labelledby="documents-tab">
        <receipt-documents></receipt-documents>
      </div>
    </div>


  </div>
</main>
