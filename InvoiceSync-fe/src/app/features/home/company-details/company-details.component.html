<main class="bg-gray-50">
  <div class="pt-13 mt-6 h-full">
    <div class="header">
      <nav class="flex mb-4 mx-4" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2 rtl:space-x-reverse">
          <li class="inline-flex items-center">
            <a routerLink="/home"
               class="inline-flex items-center text-sm font-medium text-gray-700 hover:text-blue-600">
              <svg class="w-3 h-3 me-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
                   viewBox="0 0 20 20">
                <path
                  d="m19.707 9.293-2-2-7-7a1 1 0 0 0-1.414 0l-7 7-2 2a1 1 0 0 0 1.414 1.414L2 10.414V18a2 2 0 0 0 2 2h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a2 2 0 0 0 2-2v-7.586l.293.293a1 1 0 0 0 1.414-1.414Z"/>
              </svg>
              Domov
            </a>
          </li>
          <li>
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="m1 9 4-4-4-4"/>
              </svg>
              <a routerLink="/home"
                 class="ms-1 text-sm font-medium text-gray-700 hover:text-blue-600 md:ms-2">Spoločnosti</a>
            </div>
          </li>
          <li aria-current="page">
            <div class="flex items-center">
              <svg class="rtl:rotate-180 w-3 h-3 text-gray-400 mx-1" aria-hidden="true"
                   xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                      d="m1 9 4-4-4-4"/>
              </svg>
              <span class="ms-1 text-sm font-medium text-gray-500 md:ms-2">Firma #{{ companyName }}</span>
            </div>
          </li>
        </ol>
      </nav>

      <div class="flex items-center justify-between mb-4 mx-4">
        <h1 class="text-xl font-semibold text-black">Prehľad firmy</h1>
      </div>
    </div>


    <div>
      <div class="mb-4 border-b border-gray-300">
        <ul class="flex flex-wrap -mb-px text-sm font-medium text-center justify-start" id="default-tab"
            data-tabs-toggle="#default-tab-content" role="tablist">
          <li class="me-2 mx-1" role="presentation">
            <button class="inline-block p-1 px-3 border-b-2 rounded-t-lg !text-black hover:!border-blue-500"
                    id="profile-tab" data-tabs-target="#profile" type="button" role="tab" aria-controls="profile"
                    aria-selected="false">Zakladné Informácie
            </button>
          </li>
          <li class="me-2" role="presentation">
            <button
              class="inline-block p-1 px-3 border-b-2 rounded-t-lg !text-black hover:!border-blue-500"
              id="dashboard-tab" data-tabs-target="#dashboard" type="button" role="tab" aria-controls="dashboard"
              aria-selected="false">Učtovná knižka
            </button>
          </li>
          <li class="me-2" role="presentation">
            <button
              class="inline-block p-1 px-3 border-b-2 rounded-t-lg !text-black hover:!border-blue-500"
              id="settings-tab" data-tabs-target="#settings" type="button" role="tab" aria-controls="settings"
              aria-selected="false">Nastavenia
            </button>
          </li>
        </ul>
      </div>
      <!-- tabs content -->
      <div id="default-tab-content" class="mx-3">
        <div class="hidden rounded-lg" id="profile" role="tabpanel"
             aria-labelledby="profile-tab">
          <app-company-info [companyId]="companyId"></app-company-info>
        </div>
        <div
          id="dashboard" role="tabpanel"
          aria-labelledby="dashboard-tab"
          style="background-color: #f3f7f9;">
          <app-company-account-chart [companyId]="companyId"></app-company-account-chart>
        </div>

        <div class="hidden rounded-lg"
             id="settings" role="tabpanel"
             aria-labelledby="settings-tab">
          <app-company-settings [companyId]="companyId"></app-company-settings>
        </div>
      </div>
    </div>
  </div>
</main>
