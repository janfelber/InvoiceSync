<section class="min-h-screen bg-gray-50 dark:bg-[#1a1b1e] flex flex-col items-center justify-center px-4 py-12">

  <a class="flex items-center gap-2.5 mb-8">
    <img class="w-8 h-8" ngSrc="assets/loginLogo.svg" alt="logo" height="48" width="48">
    <span class="text-xl font-bold text-gray-900 dark:text-white">InvoiceSync</span>
  </a>

  <div class="w-full max-w-sm bg-white dark:bg-[#2a2b30] rounded-2xl border border-gray-200 dark:border-[#383852] p-8">

    <ng-container *ngIf="state === 'form'">
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">Nové heslo</h1>
      <p class="text-sm text-gray-500 dark:text-slate-400 mb-7">Zadajte nové heslo pre svoj účet.</p>

      <form (submit)="submit(); $event.preventDefault()" class="space-y-4">
        <div>
          <label for="newPassword" class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-slate-300">
            Nové heslo
          </label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="••••••••••••"
            required
            minlength="12"
            class="w-full px-3 py-2.5 text-sm rounded-lg border border-gray-300 dark:border-[#383852] bg-gray-50 dark:bg-[#1a1b1e] text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
        </div>

        <div>
          <label for="confirmPassword" class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-slate-300">
            Potvrďte nové heslo
          </label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="••••••••••••"
            required
            minlength="12"
            class="w-full px-3 py-2.5 text-sm rounded-lg border border-gray-300 dark:border-[#383852] bg-gray-50 dark:bg-[#1a1b1e] text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
        </div>

        <p *ngIf="errorMessage" class="text-sm text-red-600 dark:text-red-400">{{ errorMessage }}</p>

        <button
          type="submit"
          [disabled]="submitting"
          class="w-full py-2.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-60 rounded-lg focus:ring-4 focus:ring-blue-300 focus:outline-none transition">
          Nastaviť nové heslo
        </button>
      </form>
    </ng-container>

    <ng-container *ngIf="state === 'success'">
      <div class="w-14 h-14 rounded-full bg-green-50 dark:bg-green-900/30 flex items-center justify-center mb-5">
        <svg class="w-7 h-7" fill="none" stroke="#16a34a" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Heslo bolo zmenené</h1>
      <p class="text-sm text-gray-500 dark:text-slate-400 mb-6">Teraz sa môžete prihlásiť s novým heslom.</p>
      <button
        type="button"
        (click)="goToLogin()"
        class="w-full py-2.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-300 focus:outline-none transition">
        Prejsť na prihlásenie
      </button>
    </ng-container>

    <ng-container *ngIf="state === 'invalid-token'">
      <div class="w-14 h-14 rounded-full bg-red-50 dark:bg-red-900/30 flex items-center justify-center mb-5">
        <svg class="w-7 h-7" fill="none" stroke="#dc2626" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Odkaz nie je platný</h1>
      <p class="text-sm text-gray-500 dark:text-slate-400 mb-1">Tento odkaz je neplatný alebo mu vypršala platnosť.</p>
      <p class="text-sm text-gray-500 dark:text-slate-400 mb-6">Požiadajte o nový na stránke pre zabudnuté heslo.</p>
      <a routerLink="/forgot-password" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-400">Požiadať o nový odkaz</a>
    </ng-container>

  </div>

</section>
