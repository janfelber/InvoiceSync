<section class="min-h-screen bg-gray-50 dark:bg-[#1a1b1e] flex flex-col items-center justify-center px-4 py-12">

  <a class="flex items-center gap-2.5 mb-8">
    <img class="w-8 h-8" ngSrc="assets/loginLogo.svg" alt="logo" height="48" width="48">
    <span class="text-xl font-bold text-gray-900 dark:text-white">InvoiceSync</span>
  </a>

  <div class="w-full max-w-sm bg-white dark:bg-[#2a2b30] rounded-2xl border border-gray-200 dark:border-[#383852] p-8">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">Vitajte späť</h1>
    <p class="text-sm text-gray-500 dark:text-slate-400 mb-7">Prihláste sa do svojho účtu</p>

    <form (submit)="login(); $event.preventDefault()" class="space-y-4">

      <div>
        <label for="username" class="block mb-1.5 text-sm font-medium text-gray-700 dark:text-slate-300">
          Prihlasovacie meno
        </label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="rychlo.uctovnictvo"
          required
          class="w-full px-3 py-2.5 text-sm rounded-lg border border-gray-300 dark:border-[#383852] bg-gray-50 dark:bg-[#1a1b1e] text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="text-sm font-medium text-gray-700 dark:text-slate-300">
            Heslo
          </label>
          <a routerLink="/forgot-password" class="text-sm font-medium text-blue-600 hover:underline dark:text-blue-400">Zabudli ste heslo?</a>
        </div>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required
            class="w-full px-3 py-2.5 pr-10 text-sm rounded-lg border border-gray-300 dark:border-[#383852] bg-gray-50 dark:bg-[#1a1b1e] text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-slate-300 transition">
            <svg *ngIf="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            </svg>
            <svg *ngIf="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/>
            </svg>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="w-full py-2.5 text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg focus:ring-4 focus:ring-blue-300 focus:outline-none transition">
        Prihlásiť sa
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-gray-500 dark:text-slate-400">
      Nemáte účet?
      <a routerLink="/register" class="font-medium text-blue-600 hover:underline dark:text-blue-400">Registrujte sa</a>
    </p>
  </div>

</section>
