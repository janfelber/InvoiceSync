<div class="split-container">
  <div class="left-section">
    <div class="login-form" *ngIf="!authResponse.mfaEnabled">
      <div class="title">
        <h1>
          <img src="../../../../assets/logo.png" alt="logo" />
          <span class="logo-text">InvoiceSync</span>
        </h1>
      </div>
      <div class="container mt-5">
        <h2 class="login-title">Register</h2>
        <div class="col-md-6 col-lg-4">
          <form (ngSubmit)="registerUser()">
            <div class="form-group position-relative">
              <input type="text" name="login" class="form-control pl-5" id="username" placeholder="Meno spolocnosti" required [(ngModel)]="registerRequest.username">
              <i class="fas fa-store position-absolute"></i>
            </div>
            <div class="form-group position-relative">
              <input type="text" name="login" class="form-control pl-5" id="login" placeholder="Prihlasovanie meno" required [(ngModel)]="registerRequest.login">
              <i class="fas fa-user position-absolute"></i>
            </div>
            <div class="form-group position-relative">
              <input type="password" name="password" class="form-control pl-5" id="password" placeholder="Heslo" required [(ngModel)]="registerRequest.password">
              <i class="fas fa-key position-absolute"></i>
            </div>

            <div class="form-group">
              <input
                id="rememberMe"
                name="rememberMe"
                type="checkbox"
                [(ngModel)]="registerRequest.mfaEnabled"
              >
              <label for="rememberMe">Enable 2FA (Two Factors Authentication)</label>
            </div>
            <button type="submit" class="btn login-btn">Registrovat</button>
            <span>Mate uz ucet? <a routerLink="/login">Prihlasit sa</a></span>
          </form>
        </div>
      </div>
    </div>
    <div class="tfa-container" *ngIf="authResponse.mfaEnabled">
      <div class="success-message-panel" *ngIf="message">
        <div class="success-icon">&#10004;</div>
        <div class="success-message">{{ message }}</div>
      </div>

      <h2>Set Up Two-Factor Authentication</h2>
      <div class="qr-code">
        <img [src]="authResponse.secretImageUri" alt="QR Code">
      </div>
      <div class="tfa-form-group">
        <label for="validationCode">Enter 6 digits Validation Code Generated by the app</label>
        <input
          type="text"
          id="validationCode"
          class="code-input"
          name="validationCode"
          required
          [(ngModel)]="otpCode"
        >
      </div>
      <button
        type="button" class="verify-code"
        (click)="verifyTfa()"
        [class.button-disabled]="otpCode.length < 6"
      >Verify code</button>
    </div>
  </div>
  <div class="right-section">
  </div>
</div>
