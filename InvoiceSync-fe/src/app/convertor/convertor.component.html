<div class="w-full min-h-screen">
  <div class="mx-auto p-4 pt-20">
    <div class="max-w-xl mx-auto mt-5 p-8 bg-white rounded-2xl border border-gray-200 space-y-8">
      <!-- Nadpis -->
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-gray-900">Excel Konvertor</h1>
        <p class="text-gray-500 mt-1 text-sm">Nahraj Excel súbor a vyber, kam ho chceš previesť</p>
      </div>

      <!-- Upload -->
      <div class="flex items-center justify-center w-full">
        <label for="dropzone-file"
               class="flex flex-col items-center justify-center w-full h-64 border-2 border-blue-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
          <div class="flex flex-col items-center justify-center pt-5 pb-6">
            <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 20 16">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
            </svg>
            <p class="mb-2 text-sm text-gray-500">
              <span class="font-semibold">Kliknite sem</span> alebo pretiahnite súbor
            </p>
            <p class="text-xs text-gray-500">Podporované formáty: .xlsx, .xls</p>
          </div>

          <input id="dropzone-file" type="file" accept=".xlsx,.xls" class="hidden" (change)="onFileSelected($event)"/>
        </label>
      </div>

      <div class="text-center mt-1">
        <a (click)="openModal()"
           class="text-xs text-gray-500 hover:text-blue-600 hover:underline transition">
          Ako exportovať súbor zo svojho softvéru?
        </a>
      </div>

      <tutorial-modal
        [show]="modalOpen"
        [tutorials]="myTutorials"
        (closeModal)="closeModal()"
      >
        <div>
          <label for="zip" class="block text-sm font-medium text-gray-900">PSČ</label>
          <input
            id="zip"
            name="zip"
            required
            class="mt-1 block w-full border border-gray-300 rounded-lg p-2.5"
            placeholder="Zadaj PSČ"
          />
        </div>
      </tutorial-modal>

      <!-- File Preview Box -->
      <div *ngIf="fileName" class="flex items-center gap-4 mt-4 p-4 bg-blue-50 border border-blue-300 rounded-lg">
        <!-- File ikona -->
        <svg class="w-10 h-10 text-blue-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24"
             height="24" fill="currentColor" viewBox="0 0 24 24">
          <path d="M9 7V2.221a2 2 0 0 0-.5.365L4.586 6.5a2 2 0 0 0-.365.5H9Z"/>
          <path fill-rule="evenodd"
                d="M11 7V2h7a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9h5a2 2 0 0 0 2-2Zm4.707 5.707a1 1 0 0 0-1.414-1.414L11 14.586l-1.293-1.293a1 1 0 0 0-1.414 1.414l2 2a1 1 0 0 0 1.414 0l4-4Z"
                clip-rule="evenodd"/>
        </svg>


        <!-- Názov súboru -->
        <div class="flex flex-col">
          <span class="text-blue-800 font-semibold">{{ fileName }}</span>
          <span class="text-xs text-gray-500">Súbor pripravený na spracovanie</span>
        </div>
      </div>

      <!-- Vyber softvér -->
      <div>
        <p class="text-sm font-medium text-gray-700 mb-2">Vyber cieľový softvér:</p>
        <ul class="grid w-full gap-6 md:grid-cols-2">
          <li>
            <input type="checkbox" id="react-option" value="" class="hidden peer" required="">
            <label for="react-option"
                   class="inline-flex items-center justify-between w-full p-5 text-gray-500 bg-white border-2 border-gray-200 rounded-lg cursor-pointer peer-checked:border-blue-600 hover:text-gray-600 peer-checked:text-gray-600 hover:bg-gray-50">
              <div class="block">
                <div class="w-full text-lg font-semibold">Pohoda</div>
                <div class="w-full text-sm">Bezproblémová synchronizácia s účtovným softvérom Pohoda.</div>
              </div>
            </label>
          </li>
          <li>
            <input type="checkbox" id="flowbite-option" value="" class="hidden peer" disabled>
            <label
              for="flowbite-option"
              class="relative inline-flex items-center justify-between w-full p-5 text-gray-500 bg-white border-2 border-gray-200 rounded-lg
           cursor-pointer peer-checked:border-blue-600 hover:text-gray-600 peer-checked:text-gray-600 hover:bg-gray-50
           peer-disabled:cursor-not-allowed peer-disabled:hover:bg-white peer-disabled:hover:text-gray-500">

              <!-- Badge -->
              <span class="absolute top-2 right-2 bg-red-100 text-red-800 text-xs font-semibold px-2 py-0.5 rounded">
  Vo vývoji
</span>

              <div class="block">
                <div class="w-full text-lg font-semibold">Omega</div>
                <div class="w-full text-sm">Nová integrácia systému Omega je aktuálne vo fáze vývoja.</div>
              </div>
            </label>
          </li>
        </ul>

      </div>
      <!-- Konvertovať -->
      <button (click)="startConversion()" id="convert-btn"
              class="inline-flex items-center px-6 py-3 bg-blue-600 text-white text-sm font-semibold rounded-full shadow hover:bg-blue-700 transition">
        Konvertovať
      </button>
    </div>
  </div>
</div>
