<div class="row justify-content-center">
    <div class="col-4">
        <form (ngSubmit)="onSubmitLogin()" #loginForm="ngForm">
            <div class="form-outline mb-4">
                <input class="form-control" type="login" name="login" id="loginName" [(ngModel)]="login" />
                <label for="loginName"> Username</label>
            </div>

            <div class="form-outline mb-4">
                <input class="form-control" type="password" name="password" id="loginPassword" [(ngModel)]="password" />
                <label for="loginPassword"> Password</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block mb-4">Sign In</button>
        </form>
    </div>
</div>
