<div class="split-container">
    <div class="left-section">
        <div class="login-form">
            <div class="title">
                <h1>
                    <img src="assets/logo.png" alt="logo" />
                    <span class="logo-text">InvoiceSync</span>
                </h1>
            </div>
            <div class="container mt-5">
                <h2 class="login-title">Log In</h2>
                <div class="col-md-6 col-lg-4">
                    <form>
                        <div class="form-group position-relative">
                            <input type="email" class="form-control pl-5" id="email" placeholder="Your login name">
                            <i class="fas fa-user position-absolute"></i>
                        </div>
                        <div class="form-group position-relative">
                            <input type="password" class="form-control pl-5" id="password" placeholder="Password">
                            <i class="fas fa-key position-absolute"></i>
                        </div>
                    </form>
                </div>
                <button type="button" class="btn login-btn">Log in</button>
            </div>
        </div>
    </div>
        <div class="right-section">
    </div>
</div>
