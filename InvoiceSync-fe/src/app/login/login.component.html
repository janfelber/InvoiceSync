<div class="split-container">
    <div class="left-section">
        <div class="login-form" *ngIf="!authResponse.mfaEnabled">
            <div class="title">
                <h1>
                    <img src="assets/logo.png" alt="logo" />
                    <span class="logo-text">InvoiceSync</span>
                </h1>
            </div>
            <div class="container mt-5">
                <h2 class="login-title">Log In</h2>
                <div class="col-md-6 col-lg-4">
                    <form (ngSubmit)="authenticate()">
                        <div class="form-group position-relative">
                            <input type="text" name="login" class="form-control pl-5" id="login" placeholder="Prihlasovanie meno" required [(ngModel)]="authRequest.login">
                            <i class="fas fa-user position-absolute"></i>
                        </div>
                        <div class="form-group position-relative">
                            <input type="password" name="password" class="form-control pl-5" id="password" placeholder="Heslo" required [(ngModel)]="authRequest.password">
                            <i class="fas fa-key position-absolute"></i>
                        </div>
                      <button type="submit" class="btn login-btn">Log in</button>
                      <span>Ešte nemáte účet? <a routerLink="/register">Registrovať sa</a></span>
                    </form>
                </div>
            </div>
        </div>

      <div class="tfa-container" *ngIf="authResponse.mfaEnabled">
        <h2>Two-Factor Authentication</h2>
        <div class="tfa-form-group">
          <label for="validationCode">Enter 6 digits Validation Code Generated by the app</label>
          <input
            type="text"
            class="code-input"
            id="validationCode"
            name="validationCode"
            required
            [(ngModel)]="otpCode"
          >
        </div>
        <button  class="verify-code" type="button" (click)="verifyCode()"
                 [class.button-disabled]="!otpCode || otpCode.length < 6"
        >Verify code</button>
      </div>
    </div>
        <div class="right-section">
    </div>
</div>
