name: 'is'


services:
  db:
    image: postgres:latest
    container_name: database_is
    environment:
      POSTGRES_USER: invoicesync_db_user
      POSTGRES_PASSWORD: invoicesync_db_password
      POSTGRES_DB: invoicesync_db
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped

  keycloak:
    container_name: keycloak_is
    image: quay.io/keycloak/keycloak:26.2.0
    ports:
      - 9090:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - backend
    command:
      - "start-dev"

