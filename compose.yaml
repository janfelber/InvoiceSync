name: 'is'


services:
  db:
    image: postgres:latest
    container_name: database_is
    environment:
      POSTGRES_USER: invoicesync_db_user
      POSTGRES_PASSWORD: invoicesync_db_password
      POSTGRES_DB: invoicesync_db
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
    
volumes:
  postgres: